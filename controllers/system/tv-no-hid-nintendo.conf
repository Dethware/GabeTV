# The kernel's own driver for Nintendo's Switch controllers is switched off. The TV's
# controller service talks to the Joy-Cons itself, and the driver's writes got in its way
# (controllers/DEVELOPMENT.md). The controllers get the generic HID driver instead, which
# only passes data through.
#
# "blacklist" keeps it from loading for a device and from SteamOS's preload list
# (/usr/lib/modules-load.d/hid-preload.conf); "install" closes every other way.
blacklist hid_nintendo
install hid_nintendo /bin/false
