# SteamOS 3.9 package repositories, same as /etc/pacman.conf on gabecube.
# The build container uses these so headers and libraries match the target.
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 10
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Keep the image small; docs aren't needed to build.
NoExtract = usr/share/doc/* usr/share/man/* usr/share/info/* usr/share/gtk-doc/*

[jupiter-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
[holo-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
[core-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
[extra-3.9]
Server = https://steamdeck-packages.steamos.cloud/archlinux-mirror/$repo/os/$arch
